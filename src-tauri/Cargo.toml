[package]
name = "chatgpt-codex-middleware"
version = "0.1.0"
description = "Local desktop workflow middleware for ChatGPT and Codex"
authors = ["Hua.zi"]
edition = "2021"

[lib]
name = "chatgpt_codex_middleware_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }
tokio = { version = "1.53.1", features = ["macros", "net", "sync"] }
tokio-tungstenite = "0.30.0"
uuid = { version = "1.24.1", features = ["v4", "serde"] }
